# Local broker without TLS or credentials. For any other broker, write a config of
# its own and pass it as config_path.

mqtt:
  host: localhost
  port: 1883
  # host_env: MQTT_HOST
  # port_env: MQTT_PORT
  keepalive: 60
  transport: tcp        # tcp | websockets
  protocol: mqtt        # mqtt (v3.1.1) | mqttv5
  # env_file: .mqtt_secrets.env

  # 0 at most once, 1 at least once. Per-mapping mqtt_qos overrides it.
  qos: 1

  # Without auth the bridge connects anonymously.
  # auth:
  #   username_env: MQTT_USERNAME
  #   password_env: MQTT_PASSWORD

  # TLS configuration.
  # enabled / ca_certs / certfile / keyfile all support _env variants,
  # e.g. enabled_env: MQTT_TLS, ca_certs_env: MQTT_CA_CERT, etc.
  # Relative paths resolve against MQTT_BRIDGE_CERT_DIR.
  # certfile and keyfile are needed if the broker requires client certificates.
  tls:
    enabled: false
    ca_certs: ca.crt
    certfile: client.crt
    keyfile:  client.key

    # Set true only to disable hostname verification (testing only).
    insecure: false

  reconnect_delay: 1
  reconnect_max_delay: 120

ros2_to_mqtt:
  - ros_topic: /ros2_chatter
    mqtt_topic: ros2/chatter
    msg_type: std_msgs/msg/String

mqtt_to_ros2:
  - mqtt_topic: mqtt/chatter
    ros_topic: /mqtt_chatter
    msg_type: std_msgs/msg/String
